name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm run typecheck
      - name: Tests
        run: pnpm test
      - name: Commercial contract
        run: pnpm run commercial:check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-not-real
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-not-real
      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-not-real
          SUPABASE_SERVICE_ROLE_KEY: ""
          DATAJUD_WORKER_SECRET: ""
          CRON_SECRET: ""


  android-apk:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup AIR SDK 51.3.4.3
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: '51.3.4.3'
          accept-license: true
      - name: Build LexisPredict AIR APK
        shell: pwsh
        run: .\mobile-air\build.ps1
      - name: Upload LexisPredict APK
        uses: actions/upload-artifact@v4
        with:
          name: LexisPredict_AIR_ARM64_1.0.0
          path: mobile-air/build/LexisPredict_AIR_ARM64_1.0.0.apk
          if-no-files-found: error
